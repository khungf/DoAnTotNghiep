<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Hỗ trợ Khẩn cấp SOS</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#dc2626">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4 max-w-4xl">
        <header class="bg-red-600 text-white p-4 rounded-xl shadow mb-4 flex justify-between items-center">
            <h1 class="text-lg font-bold">🚨 Đồ Án Tốt Nghiệp - SOS App</h1>
            <span class="bg-white text-red-600 px-3 py-1 rounded text-xs font-bold">PWA Ready</span>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Bản đồ -->
            <div class="bg-white p-4 rounded-xl shadow">
                <h2 class="font-bold text-gray-700 mb-2">Bản đồ định vị sự cố</h2>
                <div id="map" class="h-72 rounded-lg border"></div>
            </div>

            <!-- Danh sách & Thao tác -->
            <div class="bg-white p-4 rounded-xl shadow flex flex-col justify-between">
                <div>
                    <h2 class="font-bold text-gray-700 mb-2">Danh sách SOS trực tuyến</h2>
                    <div id="sos-list" class="space-y-2 max-h-56 overflow-y-auto pr-1">
                        <p class="text-gray-400 text-sm">Đang tải dữ liệu...</p>
                    </div>
                </div>
                <button onclick="createSOS()" class="mt-4 w-full bg-red-600 text-white py-2 rounded-lg font-bold hover:bg-red-700 transition">
                    + Tạo ca SOS mẫu
                </button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([10.762622, 106.660172], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        async function loadSOS() {
            const res = await fetch('/api/sos/list');
            const data = await res.json();
            const listEl = document.getElementById('sos-list');
            listEl.innerHTML = '';
            data.forEach(item => {
                L.marker([item.lat, item.lng]).addTo(map).bindPopup(item.description);
                listEl.innerHTML += `
                    <div class="p-2 border rounded-lg bg-gray-50 flex justify-between items-center text-sm">
                        <div><b class="text-red-600">[${item.level}]</b> ${item.description}</div>
                        <span class="text-xs px-2 py-0.5 bg-blue-100 text-blue-800 rounded font-semibold">${item.status}</span>
                    </div>`;
            });
        }

        async function createSOS() {
            await fetch('/api/sos/create', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    user_id: 1,
                    lat: 10.76 + (Math.random() - 0.5) * 0.05,
                    lng: 106.66 + (Math.random() - 0.5) * 0.05,
                    description: "Yêu cầu cứu hộ khẩn cấp từ người dùng",
                    level: "Khẩn cấp cao"
                })
            });
            loadSOS();
        }

        loadSOS();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js');
        }
    </script>
</body>
</html>
